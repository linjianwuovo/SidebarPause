plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linjianwu.sidebarpause'
    compileSdk 37

    defaultConfig {
        applicationId 'com.linjianwu.sidebarpause'
        minSdk 30
        targetSdk 36
        versionCode 16
        versionName '1.15'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
